<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Covid Navigator - Ärztekarte</title>

    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/navigation.css">
    <link rel="stylesheet" href="styles/footer-style.css">
    <link rel="stylesheet" href="styles/lcnprotocol_table.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="styles/aerzte_karte.css?v=4">
</head>

<script>
    function toggleMobileMenu() {
        const navList = document.querySelector('.main-nav ul');
        navList.classList.toggle('show');
    }
</script>

<body class="doctor-map-page">

    <div id="header-placeholder"></div>

    <div class="container">
        <section class="doctor-navigation-panel" aria-label="Navigation für Ärztinnen- und Ärztesuche">
			<button
				id="doctor-navigation-toggle-button"
				class="doctor-navigation-header"
				type="button"
				aria-expanded="true"
				aria-controls="doctor-navigation-content"
			>
				<span class="doctor-navigation-header-left">
					<span class="doctor-navigation-header-icon" aria-hidden="true">☷</span>
					<span>Navigation</span>
				</span>
				<span class="doctor-navigation-chevron" aria-hidden="true">⌃</span>
			</button>

			<div id="doctor-navigation-content" class="doctor-navigation-content">
				<div class="doctor-navigation-grid">
					<section class="doctor-nav-section doctor-nav-section-sort">
						<h3 class="doctor-nav-heading">
							Sortierung
							<span class="doctor-nav-info" data-tooltip="Legt fest, in welcher Reihenfolge die Ergebnisse angezeigt werden. Die Sortierung nach Entfernung ist erst möglich, wenn ein Standort gesetzt wurde." tabindex="0" aria-label="Info: Sortierung">i</span>
						</h3>

						<label class="doctor-nav-label" for="doctor-sort-select">Sortieren nach</label>
						<select id="doctor-sort-select" class="doctor-nav-select">
							<option value="name:asc">Name A–Z</option>
							<option value="name:desc">Name Z–A</option>
							<option value="distance:asc">Entfernung ↑</option>
							<option value="distance:desc">Entfernung ↓</option>
							<option value="positive_ratio:desc">Positive Erfahrungen [%] ↓</option>
							<option value="positive_ratio:asc">Positive Erfahrungen [%] ↑</option>
							<option value="negative_ratio:asc">Negative Erfahrungen [%] ↑</option>
							<option value="negative_ratio:desc">Negative Erfahrungen [%] ↓</option>
							<option value="total_votes:desc">Anzahl Bewertungen ↓</option>
							<option value="total_votes:asc">Anzahl Bewertungen ↑</option>
						</select>
					</section>

					<section class="doctor-nav-section doctor-nav-section-specialty">
						<h3 class="doctor-nav-heading">
							Fachrichtung
							<span class="doctor-nav-info" data-tooltip="Filtert Ärzt:innen nach der zugeordneten Fachrichtung. Die Auswahl wird aus den vorhandenen Fachrichtungen in der Datenbank geladen." tabindex="0" aria-label="Info: Fachrichtung">i</span>
						</h3>

						<label class="doctor-nav-label" for="doctor-specialty-select">Fachrichtung auswählen</label>
						<select id="doctor-specialty-select" class="doctor-nav-select">
							<option value="0">Alle Fachrichtungen</option>
						</select>
					</section>

					<section class="doctor-nav-section doctor-nav-section-rating">
						<h3 class="doctor-nav-heading">
							Bewertung
							<span class="doctor-nav-info" data-tooltip="Filtert Ärztinnen und Ärzte nach Erfahrungswerten: positive Erfahrungen mindestens X %, negative Erfahrungen höchstens Y %." tabindex="0" aria-label="Info: Bewertung">i</span>
						</h3>

						<div class="doctor-rating-control">
							<label class="doctor-nav-label" for="doctor-min-positive-input">
								Positive Erfahrungen (mind.)
							</label>

							<div class="doctor-range-row">
								<div class="doctor-range-wrap">
									<input
										id="doctor-min-positive-range"
										class="doctor-nav-range"
										type="range"
										min="0"
										max="100"
										step="1"
										value="0"
									>
									<div class="doctor-range-scale">
										<span>0</span>
										<span>50</span>
										<span>100</span>
									</div>
								</div>

								<input
									id="doctor-min-positive-input"
									class="doctor-nav-number"
									type="number"
									min="0"
									max="100"
									step="1"
									value="0"
								>
								<span class="doctor-percent-label">%</span>
							</div>
						</div>

						<div class="doctor-rating-control">
							<label class="doctor-nav-label" for="doctor-max-negative-input">
								Negative Erfahrungen (max.)
							</label>

							<div class="doctor-range-row">
								<div class="doctor-range-wrap">
									<input
										id="doctor-max-negative-range"
										class="doctor-nav-range"
										type="range"
										min="0"
										max="100"
										step="1"
										value="100"
									>
									<div class="doctor-range-scale">
										<span>0</span>
										<span>50</span>
										<span>100</span>
									</div>
								</div>

								<input
									id="doctor-max-negative-input"
									class="doctor-nav-number"
									type="number"
									min="0"
									max="100"
									step="1"
									value="100"
								>
								<span class="doctor-percent-label">%</span>
							</div>
						</div>
					</section>

					<section class="doctor-nav-section doctor-nav-section-insurance">
						<h3 class="doctor-nav-heading">
							Versicherung
							<span class="doctor-nav-info" data-tooltip="Filtert nach Abrechnungsmöglichkeit: GKV für gesetzliche Krankenkasse, PKV / Selbstzahler für private Abrechnung oder Selbstzahlung." tabindex="0" aria-label="Info: Versicherung">i</span>
						</h3>

						<label class="doctor-nav-checkbox-row" for="doctor-accepts-gkv-input">
							<input
								id="doctor-accepts-gkv-input"
								type="checkbox"
							>
							GKV
						</label>

						<label class="doctor-nav-checkbox-row" for="doctor-accepts-pkv-input">
							<input
								id="doctor-accepts-pkv-input"
								type="checkbox"
							>
							PKV / Selbstzahler
						</label>
					</section>

					<section class="doctor-nav-section doctor-nav-section-contact">
						<h3 class="doctor-nav-heading">
							Kontakt
							<span class="doctor-nav-info" data-tooltip="Filtert nach vorhandenen Kontaktinformationen wie Website, E-Mail-Adresse oder Telefonnummer." tabindex="0" aria-label="Info: Kontakt">i</span>
						</h3>

						<label class="doctor-nav-checkbox-row" for="doctor-has-website-input">
							<input
								id="doctor-has-website-input"
								type="checkbox"
							>
							Website hinterlegt
						</label>

						<label class="doctor-nav-checkbox-row" for="doctor-has-email-input">
							<input
								id="doctor-has-email-input"
								type="checkbox"
							>
							E-Mail hinterlegt
						</label>

						<label class="doctor-nav-checkbox-row" for="doctor-has-phone-input">
							<input
								id="doctor-has-phone-input"
								type="checkbox"
							>
							Telefonnummer hinterlegt
						</label>
					</section>

					<section class="doctor-nav-section doctor-nav-section-location">
						<h3 class="doctor-nav-heading">
							Standortsuche
							<span class="doctor-nav-info" data-tooltip="Radius sucht im Umkreis einer Adresse oder eines Ortes. Ort filtert nach dem eingegebenen Ortsnamen." tabindex="0" aria-label="Info: Standortsuche">i</span>
						</h3>

						<label class="doctor-nav-label" for="doctor-location-input">Adresse oder Ort</label>
						<div class="doctor-location-input-row">
							<input
								id="doctor-location-input"
								class="doctor-nav-text-input"
								type="text"
								value=""
								placeholder="z. B. Venloer Straße 123, Köln"
							>
							<button id="doctor-location-clear-button" class="doctor-location-clear-button is-hidden" type="button" aria-label="Gespeicherten Standort entfernen">×</button>
							<div id="doctor-location-suggestions" class="location-suggestions is-hidden" role="listbox" aria-label="Standortvorschläge"></div>
						</div>

						<div class="doctor-location-mode-switch" aria-label="Suchmodus">
							<button
								id="doctor-location-mode-radius-button"
								class="doctor-location-mode-button is-active"
								type="button"
								aria-pressed="true"
							>
								Radius
							</button>

							<button
								id="doctor-location-mode-city-button"
								class="doctor-location-mode-button"
								type="button"
								aria-pressed="false"
							>
								Ort
							</button>
						</div>

						<label class="doctor-nav-checkbox-row" for="doctor-radius-enabled-input">
							<input id="doctor-radius-enabled-input" type="checkbox">
							Radius aktivieren
						</label>

						<label class="doctor-nav-checkbox-row" for="doctor-include-no-coords-input">
							<input
								id="doctor-include-no-coords-input"
								type="checkbox"
							>
							Einträge ohne Koordinaten einbeziehen
							<span class="doctor-nav-info" data-tooltip="Zeigt bei aktivem Radius zusätzlich Einträge an, für die keine Kartenposition vorhanden ist. Für diese Einträge kann keine Entfernung berechnet werden." tabindex="0" aria-label="Info: Einträge ohne Koordinaten einbeziehen">i</span>
						</label>

						<label class="doctor-nav-label" for="doctor-radius-input">Radius in km</label>
						<input
							id="doctor-radius-input"
							class="doctor-nav-text-input doctor-radius-input"
							type="number"
							min="1"
							max="500"
							step="1"
							value="100"
						>
					</section>
				</div>

				<div class="doctor-navigation-actions">
					<span id="doctor-map-count" class="doctor-map-count">
						-
					</span>

					<div class="doctor-navigation-button-group">
						<button id="doctor-filter-reset-button" class="doctor-navigation-reset-button" type="button">
							Filter zurücksetzen
						</button>
					</div>
				</div>
			</div>
		</section>

		<section class="doctor-map-panel" aria-label="Karte">
			<button
				id="doctor-map-toggle-button"
				class="doctor-map-header"
				type="button"
				aria-expanded="true"
				aria-controls="doctor-map-content"
			>
				<span class="doctor-map-header-left">
					<span class="doctor-map-header-icon" aria-hidden="true">▦</span>
					<span>Karte</span>
				</span>
				<span class="doctor-map-chevron" aria-hidden="true">⌃</span>
			</button>

			<div id="doctor-map-content" class="doctor-map-content">
				<section id="doctor-map-section" class="doctor-map-section">
					<div id="doctor-map"></div>
				</section>

				<p id="doctor-map-status" class="doctor-map-status">
					Bitte Standort und Radius eingeben oder Radiusbegrenzung deaktivieren.
				</p>
			</div>
		</section>

		<section class="doctor-results-panel" aria-label="Ärztinnen und Ärzte">
			<div class="doctor-results-header">
				<span class="doctor-results-header-left">
					<span class="doctor-results-header-icon" aria-hidden="true">▤</span>
					<span>Ärzt:innen</span>
				</span>

				<div class="doctor-view-switch doctor-view-switch-in-header" aria-label="Ansicht wechseln">
					<button
						id="doctor-card-view-button"
						class="doctor-view-switch-button is-active"
						type="button"
						data-view="cards"
					>
						Kacheln
					</button>

					<button
						id="doctor-table-view-button"
						class="doctor-view-switch-button"
						type="button"
						data-view="table"
					>
						Tabelle
					</button>
				</div>
			</div>

			<div class="doctor-results-search-panel" aria-label="Ärztinnen und Ärzte suchen und vergleichen">
				<div class="doctor-results-search-row">
					<div class="doctor-results-search-field">
						<label class="doctor-results-search-label" for="doctor-search-input">Ärzt:in / Anbieter suchen</label>
						<input
							id="doctor-search-input"
							class="doctor-results-search-input"
							type="text"
							placeholder="z. B. Jäger, Kacik, Stingl"
						>
					</div>

					<div class="doctor-results-sort-field">
						<label class="doctor-results-search-label" for="doctor-results-sort-select">Sortieren nach</label>
						<select id="doctor-results-sort-select" class="doctor-results-search-input doctor-results-sort-select">
							<option value="name:asc">Name A–Z</option>
							<option value="name:desc">Name Z–A</option>
							<option value="distance:asc">Entfernung ↑</option>
							<option value="distance:desc">Entfernung ↓</option>
							<option value="positive_ratio:desc">Positive Erfahrungen [%] ↓</option>
							<option value="positive_ratio:asc">Positive Erfahrungen [%] ↑</option>
							<option value="negative_ratio:asc">Negative Erfahrungen [%] ↑</option>
							<option value="negative_ratio:desc">Negative Erfahrungen [%] ↓</option>
							<option value="total_votes:desc">Anzahl Bewertungen ↓</option>
							<option value="total_votes:asc">Anzahl Bewertungen ↑</option>
						</select>
					</div>

				</div>

				<div id="doctor-compare-selection" class="doctor-compare-selection is-hidden" aria-live="polite">
					<div class="doctor-compare-selection-topline">
						<span id="doctor-compare-status" class="doctor-compare-status"></span>

						<div class="doctor-results-mode-switch" aria-label="Ergebnisansicht wählen">
							<button
								id="doctor-results-hit-view-button"
								class="doctor-results-mode-button is-active"
								type="button"
							>
								Trefferansicht
							</button>

							<button
								id="doctor-compare-show-button"
								class="doctor-results-mode-button"
								type="button"
								disabled
							>
								Vergleichsansicht
							</button>
						</div>
					</div>

					<div id="doctor-compare-chips" class="doctor-compare-chips"></div>

					<button id="doctor-compare-clear-button" class="doctor-compare-clear-button" type="button" disabled>
						Auswahl leeren
					</button>
				</div>
			</div>
		</section>

		<section id="doctor-card-results-section" class="doctor-card-results-section">

            <div id="doctor-card-results" class="doctor-card-grid">
                <p class="doctor-empty-state">Noch keine Ergebnisse geladen.</p>
            </div>
        </section>

        <section id="doctor-table-results-section" class="doctor-map-results-section is-hidden">

            <table class="doctor-map-results-table">
				<thead>
					<tr>
						<th><button class="doctor-table-sort-button" type="button" data-table-sort-key="rank"><span class="table-rank-label-full">Platz</span><span class="table-rank-label-short">#</span> <span class="doctor-table-sort-indicator" aria-hidden="true"></span></button></th>
						<th><button class="doctor-table-sort-button" type="button" data-table-sort-key="name">Ärzt:in <span class="doctor-table-sort-indicator" aria-hidden="true"></span></button></th>
						<th><button class="doctor-table-sort-button" type="button" data-table-sort-key="location">Standort <span class="doctor-table-sort-indicator" aria-hidden="true"></span></button></th>
						<th><button class="doctor-table-sort-button" type="button" data-table-sort-key="experience">Erfahrung <span class="doctor-table-header-note">(n = Votes)</span> <span class="doctor-table-sort-indicator" aria-hidden="true"></span></button></th>
						<th><button class="doctor-table-sort-button" type="button" data-table-sort-key="insurance">Versorgung <span class="doctor-table-sort-indicator" aria-hidden="true"></span></button></th>
						<th><button class="doctor-table-sort-button" type="button" data-table-sort-key="contact">Kontakt <span class="doctor-table-sort-indicator" aria-hidden="true"></span></button></th>
					</tr>
				</thead>

				<tbody id="doctor-map-results-body">
					<tr>
						<td colspan="6">Noch keine Ergebnisse geladen.</td>
					</tr>
				</tbody>
			</table>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="scripts/aerzte_karte.js?v=4"></script>

    <div id="footer-placeholder"></div>

    <script>
        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-placeholder").innerHTML = data;
            });
    </script>

    <script>
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-placeholder").innerHTML = data;
            });
    </script>

</body>
</html>
