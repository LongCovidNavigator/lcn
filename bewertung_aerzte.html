<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Covid Navigator - Ärztebewertung</title>

    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/navigation.css">
    <link rel="stylesheet" href="styles/filter.css">
    <link rel="stylesheet" href="styles/lcnprotocol_table.css">
    <link rel="stylesheet" href="styles/uebersicht_table.css">
    <link rel="stylesheet" href="styles/bewertung_table.css">
    <link rel="stylesheet" href="styles/footer-style.css">
</head>

<script>
    function toggleMobileMenu() {
        const navList = document.querySelector('.main-nav ul');
        navList.classList.toggle('show');
    }
</script>

<body class="doctor-rating-page">

    <div id="header-placeholder"></div>

    <div class="container">
        <h1>Ärztebewertung</h1>

			<div class="rating-controls">
				<div class="doctor-sort-wrapper">
					<button id="doctor-sort-button" class="doctor-sort-button" type="button">
						Sortieren ▾
					</button>

					<div id="doctor-sort-menu" class="doctor-sort-menu">
						<button type="button" data-sort-key="name">Name</button>
						<button type="button" data-sort-key="positive_ratio">Positive Erfahrungen [%]</button>
						<button type="button" data-sort-key="negative_ratio">Negative Erfahrungen [%]</button>
						<button type="button" data-sort-key="total_votes">Anzahl Bewertungen</button>
					</div>
				</div>

				<div class="doctor-filter-wrapper">
					<button id="doctor-filter-button" class="doctor-filter-button" type="button">
						Filter ▾
					</button>

					<div id="doctor-filter-menu" class="doctor-filter-menu">
						<label for="doctor-min-votes-input">Min. Bewertungen</label>

						<div class="min-votes-row">
							<input
								id="doctor-min-votes-input"
								class="doctor-min-votes-input"
								type="number"
								min="0"
								step="1"
								value="0"
							>
							<span id="doctor-max-votes-display" class="max-votes-display">
								Höchstwert: -
							</span>
						</div>
					</div>
				</div>
			</div>

			<table class="bewertung-table">
            <thead>
                <tr>
					<th>#</th>
					<th>Arzt / Ärztin</th>
					<th>Bewertung</th>
					<th>Anzahl Bewertungen</th>
					<th>Positive Erfahrungen in [%]</th>
					<th>Negative Erfahrungen in [%]</th>
				</tr>
            </thead>

            <tbody>
                <!-- Rows populated dynamically -->
            </tbody>
        </table>
    </div>

    <script src="scripts/bewertung_aerzte.js"></script>

    <div id="footer-placeholder"></div>

    <script>
        fetch("components/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-placeholder").innerHTML = data;
            });
    </script>

    <script>
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-placeholder").innerHTML = data;
            });
    </script>

</body>
</html>
